<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Square, full-bleed source for the PNG app icons (apple-touch-icon,
    icon-192, icon-512). Same amber disc + music note as favicon.svg, but on
    the site's dark background so it reads as a tile rather than a floating
    circle.

    The disc is 80% of the canvas, which is also the Android maskable safe
    zone, so the mark survives whatever shape the OS crops the tile into.

    Regenerate the PNGs from this file after editing it — see frontend/ICONS.md.
  -->
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0a0a0a" />
  <circle cx="256" cy="256" r="205" fill="url(#amber)" />
  <g
    transform="translate(140.7 140.7) scale(9.61)"
    fill="none"
    stroke="#0a0a0a"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M9 18V5l12-2v13" />
    <circle cx="6" cy="18" r="3" />
    <circle cx="18" cy="16" r="3" />
  </g>
</svg>
