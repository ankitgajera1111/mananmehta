<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0a0a0a" />

        <!--
          This title and description are what search engines and social previews
          read on first load. They are also kept in sync at runtime from
          Settings -> Search engines in the admin panel (see useDocumentHead in
          src/context/ContentContext.jsx), so the client can change them without
          touching this file.
        -->
        <title>Manan Mehta | Film &amp; Television Composer</title>
        <meta
            name="description"
            content="Manan Mehta is a Mumbai-based music composer and producer creating scores for films, documentaries and advertising campaigns."
        />

        <!--
          Icons. Modern browsers take the SVG; favicon.ico is the fallback for
          older browsers and for crawlers that only ever request /favicon.ico.
          apple-touch-icon must be an opaque PNG (iOS ignores SVG here), and the
          manifest carries the Android / PWA install icons.
          Sources and regeneration steps: see frontend/ICONS.md.
        -->
        <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="16x16 32x32 48x48" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />
        <link rel="canonical" href="https://manankmehta.com/" />

        <!-- Link previews (WhatsApp, iMessage, LinkedIn, X). -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Manan Mehta" />
        <meta property="og:title" content="Manan Mehta | Film &amp; Television Composer" />
        <meta
            property="og:description"
            content="Crafting sonic landscapes for visual stories. Scores for films, documentaries and brand campaigns."
        />
        <meta property="og:url" content="https://manankmehta.com/" />
        <meta name="twitter:card" content="summary_large_image" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    </head>
    <body>
        <noscript>You need to enable JavaScript to view this site.</noscript>
        <div id="root"></div>
    </body>
</html>
