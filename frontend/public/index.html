<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0a0a0a" />

        <!--
          This title and description are what search engines and social previews
          read on first load. They are also kept in sync at runtime from
          Settings -> Search engines in the admin panel (see useDocumentHead in
          src/context/ContentContext.jsx), so the client can change them without
          touching this file.
        -->
        <title>Manan Mehta | Film &amp; Television Composer</title>
        <meta
            name="description"
            content="Manan Mehta is a Mumbai-based music composer and producer creating scores for films, documentaries and advertising campaigns."
        />

        <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />
        <link rel="canonical" href="https://mananmehta.vercel.app/" />

        <!-- Link previews (WhatsApp, iMessage, LinkedIn, X). -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Manan Mehta" />
        <meta property="og:title" content="Manan Mehta | Film &amp; Television Composer" />
        <meta
            property="og:description"
            content="Crafting sonic landscapes for visual stories. Scores for films, documentaries and brand campaigns."
        />
        <meta property="og:url" content="https://mananmehta.vercel.app/" />
        <meta name="twitter:card" content="summary_large_image" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    </head>
    <body>
        <noscript>You need to enable JavaScript to view this site.</noscript>
        <div id="root"></div>
    </body>
</html>
